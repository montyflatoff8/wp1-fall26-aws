name: CI

# Deliberately credential-free: no AWS secrets, no OIDC, no permissions block.
# Tests run fully offline against a fake S3 client.
on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ '**' ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore Wp1Fall26Aws.slnx

      - name: Build
        run: dotnet build Wp1Fall26Aws.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test Wp1Fall26Aws.slnx --configuration Release --no-build
